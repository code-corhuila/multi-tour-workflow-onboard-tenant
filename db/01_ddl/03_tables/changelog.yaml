databaseChangeLog:
  - changeSet:
      id: onboard-tenant-ddl-tables-001
      author: Molina211
      labels: "HU-WFL-001,ddl,tables"
      comment: "The onboard-tenant saga and its steps, saved after every step so a restart can resume or compensate (Annex E, rule 2)."
      changes:
        - sqlFile:
            path: 001_create_onboard_tenant_saga.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_onboard_tenant_saga.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
